name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: rentbill-linux-amd64
            make_target: linux
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact: rentbill-linux-arm64
            make_target: linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: rentbill-darwin-arm64
            make_target: mac
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: rentbill-darwin-amd64
            make_target: mac-intel
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: rentbill-windows-amd64.exe
            make_target: windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Get tag name
        id: get_tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binary
        id: build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          make ${{ matrix.make_target }}
          echo "binary=${{ matrix.artifact }}" >> $GITHUB_OUTPUT
          echo "path=$(pwd)/${{ matrix.artifact }}" >> $GITHUB_OUTPUT

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: RentBill ${{ steps.get_tag.outputs.tag }}
          body: |
            ## RentBill ${{ steps.get_tag.outputs.tag }}

            Pure Go desktop/local-server rental & billing management application.

            ### Features
            - Properties, tenants, bills, payments & expenses management
            - Batch monthly bill generation with meter readings
            - 4-digit PIN security lock with rate limiting
            - CSV & JSON backup/export
            - LAN sharing for phone access over Wi-Fi
            - Dark theme (workshop palette)
            - Pure Go static binary (CGO_ENABLED=0)

            ### Installation
            ```bash
            ./rentbill.sh install --share
            ```

            Or run directly:
            ```bash
            ./rentbill
            ```
          files: ${{ steps.build.outputs.path }}
          draft: false
          prerelease: false
