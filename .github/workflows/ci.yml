name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Run Unit & Integration Tests
        run: go test -v ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Test Production Binary Compilation
        run: go build -v -ldflags="-s -w" -o rentbill .
