name: Build & Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Multi-Platform Binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: rentbill-linux-amd64
            output_name: rentbill
          - goos: linux
            goarch: arm64
            artifact_name: rentbill-linux-arm64
            output_name: rentbill
          - goos: windows
            goarch: amd64
            artifact_name: rentbill-windows-amd64
            output_name: rentbill.exe
          - goos: darwin
            goarch: arm64
            artifact_name: rentbill-darwin-arm64
            output_name: rentbill
          - goos: darwin
            goarch: amd64
            artifact_name: rentbill-darwin-amd64
            output_name: rentbill

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/${{ matrix.output_name }} .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.output_name }}
