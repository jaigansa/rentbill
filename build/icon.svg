<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Glowing Accent Ring -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Building / Property Shield Icon with Shadow -->
  <g filter="url(#shadow)">
    <!-- Base Building -->
    <path d="M128 200 L256 100 L384 200 V400 H128 Z" fill="url(#accentGrad)"/>
    <!-- Roof Overhang Highlight -->
    <path d="M116 206 L256 96 L396 206 L384 220 L256 118 L128 220 Z" fill="url(#roofGrad)"/>
    
    <!-- Building Windows (Grid of 6) -->
    <!-- Row 1 -->
    <rect x="168" y="210" width="36" height="36" rx="6" fill="#f8fafc"/>
    <rect x="238" y="210" width="36" height="36" rx="6" fill="#f8fafc"/>
    <rect x="308" y="210" width="36" height="36" rx="6" fill="#f8fafc"/>
    <!-- Row 2 -->
    <rect x="168" y="264" width="36" height="36" rx="6" fill="#f8fafc"/>
    <rect x="238" y="264" width="36" height="36" rx="6" fill="#f8fafc"/>
    <rect x="308" y="264" width="36" height="36" rx="6" fill="#f8fafc"/>

    <!-- Door / Vault Entrance -->
    <path d="M228 400 V330 H284 V400 Z" fill="#0f172a"/>

    <!-- Floating Currency / Rupee Badge in Front -->
    <circle cx="360" cy="350" r="54" fill="#10b981" stroke="#f8fafc" stroke-width="5"/>
    <!-- Rupee symbol in Badge -->
    <text x="360" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>
  </g>
</svg>
