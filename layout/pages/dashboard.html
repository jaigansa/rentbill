        <!-- 1. DASHBOARD PAGE -->
        <section id="page-dashboard" class="page-section active">
          <div class="page-header">
            <h1 id="i18n-dash-title">Financial Dashboard</h1>
          </div>

          <div class="dashboard-grid">
            <div class="card admin-only">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="label" id="i18n-stat-billed">Total Billed</span>
                <i data-lucide="bar-chart-3" style="color: var(--primary);"></i>
              </div>
              <span class="value" id="val-billed">₹0.00</span>
            </div>
            <div class="card admin-only">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="label" id="i18n-stat-collected">Total Collected</span>
                <i data-lucide="wallet" style="color: var(--success);"></i>
              </div>
              <span class="value" id="val-collected" style="color: var(--success);">₹0.00</span>
            </div>
            <div class="card admin-only">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="label" id="i18n-stat-outstanding">Outstanding Dues</span>
                <i data-lucide="clock" style="color: var(--danger);"></i>
              </div>
              <span class="value" id="val-outstanding" style="color: var(--danger);">₹0.00</span>
            </div>
            <div class="card admin-only">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="label" id="i18n-stat-arrears">Arrears Balance</span>
                <i data-lucide="alert-triangle" style="color: var(--warning);"></i>
              </div>
              <span class="value" id="val-arrears" style="color: var(--warning);">₹0.00</span>
            </div>
            <div class="card admin-only">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="label" id="i18n-stat-expenses">Total Expenses</span>
                <i data-lucide="trending-down" style="color: var(--danger);"></i>
              </div>
              <span class="value" id="val-expenses">₹0.00</span>
            </div>
            <div class="card admin-only">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="label" id="i18n-stat-tenants">Active Tenants</span>
                <i data-lucide="users" style="color: var(--primary);"></i>
              </div>
              <span class="value" id="val-tenants">0</span>
            </div>
            <div class="card admin-only">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="label" id="i18n-stat-vacant">Vacant Units</span>
                <i data-lucide="key" style="color: var(--warning);"></i>
              </div>
              <span class="value" id="val-vacant">0</span>
            </div>
            <div class="card admin-only">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="label" id="i18n-stat-maintenance">Pending Proofs</span>
                <i data-lucide="file-check" style="color: var(--text-muted);"></i>
              </div>
              <span class="value" id="val-proofs">0</span>
            </div>
          </div>
        </section>
