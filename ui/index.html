<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rent Bill Pro</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="/css/style.css">
    <!-- Local Libraries -->
    <script src="/libs/lucide.min.js"></script>
    <script src="/libs/qrcode.min.js"></script>
    <script src="/libs/chart.min.js"></script>
</head>
<body>

    <div id="pinOverlay" class="modal-overlay hidden"></div>
    <div id="mainApp" class="hidden"></div>
    <div id="modalContainer"></div>
    <div id="notification-container"></div>
    
    <!-- UI Templates -->
    <template id="tpl-authOverlay">
        <div class="modal-content" style="max-width: 360px; text-align: center; border: none; box-shadow: var(--shadow-xl);">
            <div class="modal-body" style="padding: 3rem 2rem;">
                <form onsubmit="event.preventDefault(); verifyPin();">
                <input type="text" value="admin" autocomplete="username" style="display:none;">
                <div class="sidebar-brand" style="width: 64px; height: 64px; margin: 0 auto 1.5rem; background: var(--primary); color: white; border-radius: 20px;">
                    <i data-lucide="building-2" style="width: 32px; height: 32px;"></i>
                </div>
                <h2 style="font-weight: 900; font-size: 1.5rem; color: var(--text-main); margin-bottom: 0.5rem;">RentBill Pro</h2>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2.5rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Authorized Access Only</p>
                
                <div class="pin-dots" style="display: flex; justify-content: center; gap: 1.25rem; margin-bottom: 2.5rem;">
                    <div class="dot" style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.2s ease;"></div>
                    <div class="dot" style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.2s ease;"></div>
                    <div class="dot" style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.2s ease;"></div>
                    <div class="dot" style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.2s ease;"></div>
                </div>

                <div class="pin-keypad" id="pinKeypad" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; max-width: 240px; margin: 0 auto;">
                    <button type="button" onclick="pressKey('1')" class="btn btn-secondary" style="height: 64px; font-size: 1.5rem; font-weight: 800; border-radius: 16px;">1</button>
                    <button type="button" onclick="pressKey('2')" class="btn btn-secondary" style="height: 64px; font-size: 1.5rem; font-weight: 800; border-radius: 16px;">2</button>
                    <button type="button" onclick="pressKey('3')" class="btn btn-secondary" style="height: 64px; font-size: 1.5rem; font-weight: 800; border-radius: 16px;">3</button>
                    <button type="button" onclick="pressKey('4')" class="btn btn-secondary" style="height: 64px; font-size: 1.5rem; font-weight: 800; border-radius: 16px;">4</button>
                    <button type="button" onclick="pressKey('5')" class="btn btn-secondary" style="height: 64px; font-size: 1.5rem; font-weight: 800; border-radius: 16px;">5</button>
                    <button type="button" onclick="pressKey('6')" class="btn btn-secondary" style="height: 64px; font-size: 1.5rem; font-weight: 800; border-radius: 16px;">6</button>
                    <button type="button" onclick="pressKey('7')" class="btn btn-secondary" style="height: 64px; font-size: 1.5rem; font-weight: 800; border-radius: 16px;">7</button>
                    <button type="button" onclick="pressKey('8')" class="btn btn-secondary" style="height: 64px; font-size: 1.5rem; font-weight: 800; border-radius: 16px;">8</button>
                    <button type="button" onclick="pressKey('9')" class="btn btn-secondary" style="height: 64px; font-size: 1.5rem; font-weight: 800; border-radius: 16px;">9</button>
                    <button type="button" onclick="forgotPin()" class="btn btn-secondary" title="Forgot PIN" style="height: 64px; border-radius: 16px; font-weight: 800;">?</button>
                    <button type="button" onclick="pressKey('0')" class="btn btn-secondary" style="height: 64px; font-size: 1.5rem; font-weight: 800; border-radius: 16px;">0</button>
                    <button type="button" onclick="pressKey('back')" class="btn btn-secondary" title="Backspace" style="height: 64px; border-radius: 16px; font-size: 0.8rem; font-weight: 800;">DEL</button>
                </div>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%; height: 54px; border-radius: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;">Confirm PIN</button>
                </div>
                </form>
            </div>
        </div>
    </template>

    <template id="tpl-navigation">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <i data-lucide="building-2"></i>
                </div>
                <div style="display: flex; flex-direction: column; overflow: hidden;" class="sidebar-text">
                    <span style="font-weight: 800; font-size: 1rem; color: var(--text-main); white-space: nowrap;">RentBill</span>
                    <span style="font-size: 0.65rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Pro Manager</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <button onclick="showSection('dashboard-section')" class="nav-btn active" title="Dashboard">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </button>
                <button onclick="showSection('tenants-section')" class="nav-btn" title="Tenants">
                    <i data-lucide="users"></i>
                    <span>Tenants</span>
                </button>
                <button onclick="showSection('owners-section')" class="nav-btn" title="Owners">
                    <i data-lucide="wallet"></i>
                    <span>Owners</span>
                </button>
                <button onclick="showSection('settings-section')" class="nav-btn" title="Settings">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button onclick="toggleDarkMode()" id="darkModeToggle" class="btn btn-secondary" style="width: 100%; justify-content: flex-start; padding: 0.75rem 1rem;" title="Toggle Theme">
                    <i data-lucide="moon" style="width: 18px; height: 18px;"></i>
                    <span style="margin-left: 0.75rem; font-size: 0.85rem;" class="sidebar-text">Appearance</span>
                </button>
                <button onclick="logout()" class="btn btn-danger" style="width: 100%; justify-content: flex-start; padding: 0.75rem 1rem; margin-top: 0.5rem;" title="Logout">
                    <i data-lucide="log-out" style="width: 18px; height: 18px;"></i>
                    <span style="margin-left: 0.75rem; font-size: 0.85rem;" class="sidebar-text">Logout</span>
                </button>
            </div>
        </aside>
    </template>

    </template>

    <template id="tpl-dashboard">
        <section id="dashboard-section" class="app-section">
            <div style="max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem;">
                
                <!-- 1. Status Header -->
                <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 0.5rem;">
                    <div>
                        <h2 style="font-size: 1.5rem; font-weight: 950; color: var(--text-main); margin: 0;">Dashboard</h2>
                        <p style="font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Building Overview</p>
                    </div>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <div id="liveStatus" class="badge" style="background: var(--bg-success-light); color: var(--success); font-size: 0.6rem; border: 1.5px solid var(--success);">
                            LIVE
                        </div>
                        <div id="offlineIndicator" class="badge badge-warning hidden" style="font-size: 0.6rem;">OFFLINE</div>
                    </div>
                </div>

                <!-- 2. Main Stats Stack (The Bottom Line) -->
                <div class="card" style="padding: 1.5rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; text-align: center; border-bottom: 4px solid var(--primary);">
                    <div>
                        <span style="font-size: 0.6rem; font-weight: 900; color: var(--text-muted); text-transform: uppercase;">Occupancy</span>
                        <div id="statActive" style="font-size: 1.5rem; font-weight: 950; color: var(--text-main);">0</div>
                    </div>
                    <div style="border-left: 1px solid var(--border); border-right: 1px solid var(--border);">
                        <span style="font-size: 0.6rem; font-weight: 900; color: var(--text-muted); text-transform: uppercase;">Collected</span>
                        <div id="statTotalIncome" style="font-size: 1.5rem; font-weight: 950; color: var(--success);">₹0</div>
                    </div>
                    <div>
                        <span style="font-size: 0.6rem; font-weight: 900; color: var(--text-muted); text-transform: uppercase;">Expenses</span>
                        <div id="statTotalExpenses" style="font-size: 1.5rem; font-weight: 950; color: var(--danger);">₹0</div>
                    </div>
                </div>

                <!-- 3. Action Queue: Needs Billing -->
                <div class="card" style="padding: 1.25rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3 style="font-size: 0.75rem; font-weight: 900; text-transform: uppercase; color: var(--warning);"><i data-lucide="zap"></i> Needs Billing</h3>
                        <span id="countBilling" class="badge badge-warning">0</span>
                    </div>
                    <div id="queueBilling" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
                </div>

                <!-- 4. Action Queue: Pending Collections -->
                <div class="card" style="padding: 1.25rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3 style="font-size: 0.75rem; font-weight: 900; text-transform: uppercase; color: var(--danger);"><i data-lucide="alert-circle"></i> Pending Dues</h3>
                        <span id="countCollection" class="badge badge-danger">0</span>
                    </div>
                    <div id="queueCollection" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
                </div>

                <!-- 5. Action Queue: Open Tasks -->
                <div class="card" style="padding: 1.25rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3 style="font-size: 0.75rem; font-weight: 900; text-transform: uppercase; color: var(--primary);"><i data-lucide="wrench"></i> Open Tasks</h3>
                        <span id="countTasks" class="badge badge-info">0</span>
                    </div>
                    <div id="queueTasks" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
                </div>

                <!-- 7. Visual Trend Chart -->
                <div class="card" style="padding: 1.5rem;">
                    <h3 class="section-title" style="font-size: 0.75rem; margin-bottom: 1.5rem;"><i data-lucide="line-chart"></i> Cash Flow Trend</h3>
                    <div style="height: 200px;"><canvas id="trendChart"></canvas></div>
                </div>

                <!-- 8. Activity Log -->
                <div class="card" style="padding: 1.25rem;">
                    <h3 class="section-title" style="font-size: 0.75rem; margin-bottom: 1rem;"><i data-lucide="history"></i> Live Activity Feed</h3>
                    <div id="activityLog" class="activity-feed"></div>
                </div>

            </div>
        </section>
    </template>

    <template id="tpl-tenants">
        <section id="tenants-section" class="app-section hidden">
            <div class="sub-nav no-print">
                <button onclick="switchSubSection('tenants-section', 'tenants-billing')" class="sub-nav-btn active">
                    <i data-lucide="zap"></i> Billing
                </button>
                <button onclick="switchSubSection('tenants-section', 'tenants-ledger')" class="sub-nav-btn">
                    <i data-lucide="receipt"></i> Ledger
                </button>
                <button onclick="switchSubSection('tenants-section', 'tenants-registry')" class="sub-nav-btn">
                    <i data-lucide="book-open"></i> Registry
                </button>
                <button onclick="switchSubSection('tenants-section', 'tenants-archived')" class="sub-nav-btn">
                    <i data-lucide="archive"></i> Archive
                </button>
            </div>

            <div id="tenants-billing" class="sub-section hidden">
                <div class="card no-print" style="padding: 1.5rem; margin-bottom: 2rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h4 style="font-size: 0.8rem; font-weight: 900; text-transform: uppercase; color: var(--primary); letter-spacing: 1px;">
                            <i data-lucide="zap" style="width: 16px;"></i> Generate Bills
                        </h4>
                        <div style="display: flex; gap: 6px; background: var(--bg-input); padding: 4px; border-radius: 8px; border: 1px solid var(--border);">
                            <button onclick="filterBilling('all')" id="filterBillAll" class="btn btn-sm active" style="font-size: 0.65rem; border: none; padding: 4px 12px;">All</button>
                            <button onclick="filterBilling('pending')" id="filterBillPending" class="btn btn-sm" style="font-size: 0.65rem; border: none; padding: 4px 12px;">Not Billed</button>
                        </div>
                    </div>
                    
                    <div style="padding: 0 1rem; display: flex; align-items: center; gap: 0.75rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; height: 44px; margin-bottom: 1.5rem;">
                        <i data-lucide="search" style="width: 16px; color: var(--text-muted);"></i>
                        <input type="text" id="searchBar" placeholder="Search unit to bill..." onkeyup="searchTenants()" style="border: none; background: transparent; width: 100%; font-size: 0.9rem; outline: none; font-weight: 500;">
                    </div>

                    <div id="tenantList"></div>
                </div>
            </div>

            <div id="tenants-ledger" class="sub-section hidden">
                <div id="historyTenantsContent">
                    <div class="card no-print" style="margin-bottom: 1.5rem;">
                        <div class="input-group" style="margin:0;">
                            <label style="font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: block;">Select Unit for Detailed Ledger</label>
                            <select id="historyTenantSelect" onchange="loadTenantHistory(this.value)" style="font-weight: 900; color: var(--primary); border: 2px solid var(--primary); border-radius: 12px; height: 50px; font-size: 1rem; padding: 0 1rem; background: var(--bg-card);">
                                <option value="">-- Select Unit for History --</option>
                            </select>
                        </div>
                    </div>
                    <div id="historyResults" class="hidden">
                        <div style="display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid var(--border);">
                            <div>
                                <h3 id="historySelectedName" class="section-title" style="font-size: 1.25rem; margin-bottom: 4px; color: var(--text-main); font-weight: 950;">Tenant Name</h3>
                                <div style="font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.75px;">Comprehensive Payment History & Ledger</div>
                            </div>
                            <button onclick="printTenantStatement()" class="btn btn-secondary btn-sm" title="Print Ledger" style="border: 1px solid var(--border); height: 40px; padding: 0 1.25rem; font-weight: 800;">
                                <i data-lucide="printer"></i> <span class="sm:hidden">Print Statement</span>
                            </button>
                        </div>

                        <div id="historyTenantSummary" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1.5rem;" class="no-print">
                            <div style="background: var(--bg-danger-light); padding: 1rem; border: 1.5px solid var(--danger); border-radius: 12px; text-align: left;">
                                <div style="font-size: 0.6rem; font-weight: 900; color: var(--danger); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; opacity: 0.8;">Outstanding Arrears</div>
                                <div id="histStatBalance" style="font-weight: 950; font-size: 1.25rem; color: var(--danger); line-height: 1.2;">₹0</div>
                            </div>
                            <div style="background: var(--bg-success-light); padding: 1rem; border: 1.5px solid var(--success); border-radius: 12px; text-align: left;">
                                <div style="font-size: 0.6rem; font-weight: 900; color: var(--success); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; opacity: 0.8;">Total Paid</div>
                                <div id="histStatPaid" style="font-weight: 950; font-size: 1.25rem; color: var(--success); line-height: 1.2;">₹0</div>
                            </div>
                            <div style="background: var(--bg-info-light); padding: 1rem; border: 1.5px solid var(--info); border-radius: 12px; text-align: left;">
                                <div style="font-size: 0.6rem; font-weight: 900; color: var(--info); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; opacity: 0.8;">Security Advance</div>
                                <div id="histStatAdvance" style="font-weight: 950; font-size: 1.25rem; color: var(--info); line-height: 1.2;">₹0</div>
                            </div>
                        </div>

                        <div class="card-header no-print" style="margin-bottom: 1rem; padding: 0;">
                             <h4 style="font-size: 0.75rem; font-weight: 900; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px;">Recent Transactions</h4>
                        </div>

                        <div id="historyBody" class="history-list"></div>
                        <div id="historyLoadMoreContainer" style="margin-top: 1.5rem; text-align: center;" class="hidden no-print">
                            <button onclick="loadMoreTenantHistory()" class="btn btn-secondary btn-sm" style="width: 100%; border-style: dashed; font-weight: 900; height: 44px; letter-spacing: 0.5px;">LOAD OLDER RECORDS</button>
                        </div>
                    </div>
                    <div id="historyEmptyState" class="empty-state no-print" style="padding: 4rem 2rem; background: var(--bg-input); border: 2px dashed var(--border); border-radius: 20px;">
                        <i data-lucide="file-text" style="width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.5;"></i>
                        <p style="font-weight: 800; color: var(--text-muted); font-size: 1.1rem;">Select a unit above to view the full ledger</p>
                        <p style="font-size: 0.8rem; color: var(--text-muted); opacity: 0.7; margin-top: 8px;">You can track payments, generate statements, and manage dues here.</p>
                    </div>
                </div>
            </div>

            <div id="tenants-registry" class="sub-section hidden">
                <div class="card" style="margin-bottom: 2rem;">
                    <div class="card-header" style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between;">
                        <h3 class="section-title"><i data-lucide="users"></i> Unit Directory</h3>
                        <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; justify-content: flex-end;">
                            <input type="file" id="importCsvInput" accept=".csv" class="hidden" onchange="importTenantsCSV(this)">
                            <button onclick="document.getElementById('importCsvInput').click()" class="btn btn-secondary btn-icon-sm" title="Import CSV" style="height: 32px; width: 32px; border-radius: 8px;"><i data-lucide="upload"></i></button>
                            <button onclick="exportTenantsCSV()" class="btn btn-secondary btn-icon-sm" title="Download CSV" style="height: 32px; width: 32px; border-radius: 8px;"><i data-lucide="download"></i></button>
                            <button onclick="toggleRegForm()" id="regToggleBtn" class="btn btn-primary btn-sm" style="border-radius: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">Register</button>
                        </div>
                    </div>
                    <div id="entrance-form" class="hidden" style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 2px solid var(--border);">
                        <h4 id="form-title" style="font-size: 0.9rem; margin-bottom: 1.5rem; color: var(--primary); text-transform: uppercase; font-weight: 900;">New Registration</h4>
                        <div class="grid-inputs">
                            <div class="input-group"><label>Full Name *</label><input type="text" id="tName"></div>
                            <div class="input-group"><label>Mobile *</label><input type="text" id="tMobile"></div>
                            <div class="input-group"><label>Email Address</label><input type="email" id="tEmail"></div>
                            <div class="input-group"><label>Aadhar No</label><input type="text" id="tAadhar"></div>
                            <div class="input-group"><label>Unit / Room *</label><input type="text" id="tRoom"></div>
                            <div class="input-group"><label>Monthly Rent *</label><input type="number" id="tRent"></div>
                            <div class="input-group"><label>Security Advance</label><input type="number" id="tAdvance" value="0"></div>
                            <div class="input-group"><label>Move-in Date</label><input type="date" id="tMoveIn"></div>
                            <div class="input-group"><label>Initial EB Reading</label><input type="number" id="tInitialEb" step="0.01" value="0"></div>
                            <div class="input-group"><label>EB Unit Rate *</label><input type="number" id="tEbRate" step="0.01" value="9.00"></div>
                            <div class="input-group"><label>Water/Maint</label><input type="number" id="tWater" value="0"></div>
                            <div class="input-group"><label>Arrears (OB)</label><input type="number" id="tArrears" value="0"></div>
                            <div class="input-group"><label>Receiving Account *</label><select id="tAssignedUpi"><option value="">-- Select --</option></select></div>
                            <div class="input-group" style="grid-column: span 2;"><label>Permanent Address</label><input type="text" id="tPermAddr"></div>
                            <div class="input-group"><label>Emergency Contact</label><input type="text" id="tEmerg"></div>
                            <div class="input-group"><label>Occupation</label><input type="text" id="tJob"></div>
                        </div>
                        <div style="display: flex; gap: 0.5rem; margin-top: 1.5rem;">
                            <button onclick="addTenant()" id="mainSubmitBtn" class="btn btn-primary" style="flex: 2;">Save Record</button>
                            <button onclick="toggleRegForm()" class="btn btn-secondary" style="flex: 1;">Cancel</button>
                            <button id="formDeleteBtn" class="btn btn-danger btn-icon-sm hidden" title="Delete Permanent"><i data-lucide="trash-2"></i></button>
                            <button id="formAgreementBtn" class="btn btn-secondary btn-icon-sm hidden" title="Print Agreement"><i data-lucide="file-text"></i></button>
                        </div>
                    </div>
                    <div id="manageTenantList" style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem;"></div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="section-title"><i data-lucide="folder-lock"></i> Document Vault</h3>
                        <button onclick="toggleUploadForm()" id="uploadToggleBtn" class="btn btn-secondary btn-sm">New Upload</button>
                    </div>
                    <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                        <input type="text" id="vaultSearch" placeholder="Search files..." oninput="searchVault()" class="input-sm" style="flex: 2;">
                        <select id="vaultFilter" onchange="loadVault()" class="input-sm" style="flex: 1;">
                            <option value="">All Types</option>
                            <option value="ID Proof">ID Proof</option>
                            <option value="Lease Agreement">Lease</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div id="vaultList" style="margin-top: 1.5rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem;"></div>
                </div>
            </div>

            <div id="tenants-archived" class="sub-section hidden">
                <div class="card">
                    <div class="card-header">
                        <h3 class="section-title"><i data-lucide="archive"></i> Archive & History</h3>
                    </div>
                    <div id="archivedTenantList" style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem;"></div>
                </div>
            </div>
        </section>
    </template>

    <template id="tpl-owners">

    <script>
        // AGGRESSIVE CACHE RESET (Ensures latest fixes)
        async function resetAppCache() {
            if ('serviceWorker' in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                for (let reg of regs) { await reg.unregister(); }
            }
            if ('caches' in window) {
                const keys = await caches.keys();
                for (let key of keys) { await caches.delete(key); }
            }
            // Clear local storage if stuck
            if (!localStorage.getItem('v18_cleared')) {
                localStorage.clear();
                localStorage.setItem('v18_cleared', 'true');
                window.location.reload(true);
            }
        }
        resetAppCache();
    </script>
