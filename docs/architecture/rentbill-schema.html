<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentBill · Physical Database Schema</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-soft:    #64748b;
      --color-accent:  #2563eb;
      --color-accent-tint: rgba(37, 99, 235, 0.08);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1040px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Database Schema · Diagram Design</p>
    <h1>RentBill SQLite Schema &amp; Referential Constraints</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1080 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="schema-title schema-desc">
        <title id="schema-title">RentBill SQLite Schema and Foreign Key Constraints</title>
        <desc id="schema-desc">Physical SQLite relational schema diagram showing properties, tenants, bills, payments, and expenses with column types, primary keys, and cascading foreign key rules.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(15,23,42,0.08)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f8fafc"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

        <!-- ========================================== -->
        <!-- FOREIGN KEY CONNECTORS (Drawn before boxes)-->
        <!-- ========================================== -->

        <!-- FK 1: tenants.property_id (380, 138) -> properties.id (280, 114) · SET NULL -->
        <path d="M 380,138 H 338 Q 330,138 330,130 V 122 Q 330,114 322,114 H 280"
              fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- FK 2: bills.tenant_id (720, 162) -> tenants.id (630, 114) · CASCADE (Focal) -->
        <path d="M 720,162 H 683 Q 675,162 675,154 V 122 Q 675,114 667,114 H 630"
              fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- FK 3: payments.bill_id (1000, 488) -> bills.id (1000, 114) · CASCADE -->
        <path d="M 1000,488 H 1032 Q 1040,488 1040,480 V 122 Q 1040,114 1032,114 H 1000"
              fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- FK 4: expenses.property_id (160, 400) -> properties.id (160, 246) · CASCADE -->
        <line x1="160" y1="400" x2="160" y2="246" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ========================================== -->
        <!-- FK LABELS & MASKS                          -->
        <!-- ========================================== -->

        <!-- Label 1: ON DELETE SET NULL -->
        <rect x="294" y="94" width="72" height="12" rx="2" fill="#f8fafc"/>
        <text x="330" y="103" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SET NULL</text>

        <!-- Label 2: ON DELETE CASCADE (Focal Accent) -->
        <rect x="635" y="94" width="80" height="12" rx="2" fill="#f8fafc"/>
        <text x="675" y="103" fill="#2563eb" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CASCADE</text>

        <!-- Label 3: ON DELETE CASCADE (Payments) on right vertical segment x=1040 -->
        <rect x="1000" y="294" width="80" height="12" rx="2" fill="#f8fafc"/>
        <text x="1040" y="303" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CASCADE</text>

        <!-- Label 4: ON DELETE CASCADE (Expenses) -->
        <rect x="120" y="318" width="80" height="12" rx="2" fill="#f8fafc"/>
        <text x="160" y="327" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CASCADE</text>

        <!-- ========================================== -->
        <!-- TABLES                                     -->
        <!-- ========================================== -->

        <!-- Table 1: properties -->
        <g id="table-properties">
          <rect x="40" y="70" width="240" height="176" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <!-- Header -->
          <rect x="40" y="70" width="240" height="32" rx="6" fill="rgba(15,23,42,0.04)"/>
          <line x1="40" y1="102" x2="280" y2="102" stroke="#0f172a" stroke-width="0.8"/>
          <rect x="48" y="78" width="34" height="14" rx="2" fill="transparent" stroke="rgba(15,23,42,0.30)" stroke-width="0.8"/>
          <text x="65" y="88" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">TABLE</text>
          <text x="92" y="90" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">properties</text>

          <!-- Rows (24px each) -->
          <!-- Row 1: id (PK) -->
          <rect x="40" y="102" width="240" height="24" fill="transparent"/>
          <rect x="48" y="107" width="18" height="14" rx="2" fill="rgba(15,23,42,0.06)"/>
          <text x="57" y="117" fill="#0f172a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">PK</text>
          <text x="74" y="118" fill="#0f172a" font-size="10" font-family="'Geist', sans-serif">id</text>
          <text x="270" y="118" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">INTEGER</text>

          <!-- Row 2: name -->
          <rect x="40" y="126" width="240" height="24" fill="rgba(15,23,42,0.02)"/>

          <text x="270" y="142" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">TEXT</text>

          <!-- Row 3: default_rent -->

          <!-- Overflow -->

          <text x="160" y="214" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-style="italic">+ 6 more columns (water, maint)</text>
        </g>

        <!-- Table 2: expenses -->

          <!-- Row 3: title & amount -->

          <text x="270" y="496" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">TEXT</text>

          <rect x="40" y="504" width="240" height="24" fill="rgba(15,23,42,0.02)"/>
          <text x="48" y="520" fill="#0f172a" font-size="10" font-family="'Geist', sans-serif">amount</text>
          <text x="270" y="520" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">REAL</text>
        </g>

        <!-- Table 3: tenants -->
        <g id="table-tenants">
          <rect x="380" y="70" width="250" height="200" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
          <!-- Header -->
          <rect x="380" y="70" width="250" height="32" rx="6" fill="rgba(15,23,42,0.04)"/>
          <line x1="380" y1="102" x2="630" y2="102" stroke="#0f172a" stroke-width="0.8"/>
          <rect x="388" y="78" width="34" height="14" rx="2" fill="transparent" stroke="rgba(15,23,42,0.30)" stroke-width="0.8"/>
          <text x="405" y="88" fill="#475569" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">TABLE</text>
          <text x="432" y="90" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">tenants</text>

          <!-- Row 1: id (PK) -->
          <rect x="380" y="102" width="250" height="24" fill="transparent"/>

          <!-- Row 2: property_id (FK) -->

          <text x="414" y="142" fill="#0f172a" font-size="10" font-family="'Geist', sans-serif">property_id</text>
          <text x="620" y="142" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">INTEGER</text>

          <!-- Row 3: name -->

          <text x="620" y="166" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">TEXT</text>

          <!-- Row 4: phone -->

          <text x="620" y="190" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">TEXT</text>

          <!-- Row 5: security_deposit -->

          <text x="620" y="214" fill="#64748b" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">REAL</text>

          <!-- Overflow -->
          <rect x="380" y="222" width="250" height="24" fill="rgba(15,23,42,0.02)"/>
          <text x="505" y="238" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-style="italic">+ 10 more (UPI, meters, active)</text>
        </g>

          <rect x="728" y="78" width="34" height="14" rx="2" fill="transparent" stroke="rgba(37,99,235,0.50)" stroke-width="0.8"/>

          <text x="772" y="90" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">bills</text>

          <!-- Row 1: id (PK) -->
